# Must match exchange.conf: 8 TCP sources, 30 products, ports 9201..9208.
# Shards 1..4 have 6 ITEMs each; shard 5 has the three spread books; 6/7/8 have A/B/C.
symbols=1:ITEM0001,2:ITEM0002,3:ITEM0003,4:ITEM0004,5:ITEM0005,6:ITEM0006,7:ITEM0007,8:ITEM0008,9:ITEM0009,10:ITEM0010,11:ITEM0011,12:ITEM0012,13:ITEM0013,14:ITEM0014,15:ITEM0015,16:ITEM0016,17:ITEM0017,18:ITEM0018,19:ITEM0019,20:ITEM0020,21:ITEM0021,22:ITEM0022,23:ITEM0023,24:ITEM0024,25:A,26:B,27:C,28:SP_AB,29:SP_AC,30:BF_ABC
shard=shard-01,tcp,127.0.0.1,9201,/tmp/marketlab-scale-01.mmap,1,5,9,13,17,21
shard=shard-02,tcp,127.0.0.1,9202,/tmp/marketlab-scale-02.mmap,2,6,10,14,18,22
shard=shard-03,tcp,127.0.0.1,9203,/tmp/marketlab-scale-03.mmap,3,7,11,15,19,23
shard=shard-04,tcp,127.0.0.1,9204,/tmp/marketlab-scale-04.mmap,4,8,12,16,20,24
shard=shard-05,tcp,127.0.0.1,9205,/tmp/marketlab-scale-05.mmap,28,29,30
shard=shard-06,tcp,127.0.0.1,9206,/tmp/marketlab-scale-06.mmap,25
shard=shard-07,tcp,127.0.0.1,9207,/tmp/marketlab-scale-07.mmap,26
shard=shard-08,tcp,127.0.0.1,9208,/tmp/marketlab-scale-08.mmap,27
# One public feed for all subscribers; no per-client destination list.
multicast_group=239.10.10.1,9001
# Local demo. On each machine use its own LAN IPv4 (or 0.0.0.0 for routing).
multicast_interface=127.0.0.1
multicast_ttl=1
multicast_loopback=1
query_host=127.0.0.1
query_port=9100
snapshot_every=10
# Client-side reordering, freshness and bounded TCP recovery.
client_reorder_wait_ms=200
client_late_after_ms=1500
client_stale_after_ms=3000
client_recovery_timeout_ms=1000
client_max_pending_batches=64
client_max_buffer_bytes=16777216
client_max_queries=8
client_retry_initial_ms=200
client_retry_max_ms=5000
source_timeout_ms=800
query_timeout_ms=3000
shm_max_age_ms=1000
max_query_connections=128
