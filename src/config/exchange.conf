# 8 order processes: shards 5..8 form one coordinated spread group.
# Demo: ITEM0001..ITEM0024 have symbolIds 1..24 (6 ITEMs per shard).
# Shard 5 owns SP_AB/SP_AC/BF_ABC; shards 6/7/8 own A/B/C respectively.
# Global symbolId is the symbol entry's position; append new entries to preserve IDs.
routing=router
spreads=enabled
coordinator=127.0.0.1,7120
spread_peer=5,127.0.0.1,8605
spread_peer=6,127.0.0.1,8606
spread_peer=7,127.0.0.1,8607
spread_peer=8,127.0.0.1,8608
gateway_listen=127.0.0.1,7001
router_listen=127.0.0.1,7100
engine_endpoint=127.0.0.1,7100
user=alice,alice-pass
user=bob,bob-pass
user=carol,carol-pass
shard=1,127.0.0.1,7201
shard=2,127.0.0.1,7202
shard=3,127.0.0.1,7203
shard=4,127.0.0.1,7204
shard=5,127.0.0.1,7205
shard=6,127.0.0.1,7206
shard=7,127.0.0.1,7207
shard=8,127.0.0.1,7208
symbol=ITEM0001,100,1
symbol=ITEM0002,100,2
symbol=ITEM0003,100,3
symbol=ITEM0004,100,4
symbol=ITEM0005,100,1
symbol=ITEM0006,100,2
symbol=ITEM0007,100,3
symbol=ITEM0008,100,4
symbol=ITEM0009,100,1
symbol=ITEM0010,100,2
symbol=ITEM0011,100,3
symbol=ITEM0012,100,4
symbol=ITEM0013,100,1
symbol=ITEM0014,100,2
symbol=ITEM0015,100,3
symbol=ITEM0016,100,4
symbol=ITEM0017,100,1
symbol=ITEM0018,100,2
symbol=ITEM0019,100,3
symbol=ITEM0020,100,4
symbol=ITEM0021,100,1
symbol=ITEM0022,100,2
symbol=ITEM0023,100,3
symbol=ITEM0024,100,4

# Calendar and butterfly books support direct trading and cross-shard implied matching.
# Bootstrap closes: A-B=10, A-C=15, A-2B+C=5.
# IDs 25..30 must match publisher.conf; use a fresh data directory after changing the universe.
symbol=A,120,6
symbol=B,110,7
symbol=C,105,8
symbol=SP_AB,10,5
symbol=SP_AC,15,5
symbol=BF_ABC,5,5
max_connections=4096
max_pending=65536
max_pending_per_client=1024
max_buffer_bytes=4194304
heartbeat_ms=500
link_timeout_ms=5000
request_timeout_ms=5000
partial_timeout_ms=2000
reconnect_ms=200
