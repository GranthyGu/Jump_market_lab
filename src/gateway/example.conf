# Small two-shard CLI demo; default deployment uses scale_32x1000.conf.
# Numeric IPv4 endpoints; use reachable host addresses for remote deployment.
routing=direct
gateway_listen=127.0.0.1,7000
router_listen=127.0.0.1,7100
engine_endpoint=127.0.0.1,7100
user=alice,alice-pass
user=bob,bob-pass
shard=1,127.0.0.1,7201
shard=2,127.0.0.1,7202
# symbol,previous close,shard; market-data IDs follow this global row order.
symbol=AAPL,100,1
symbol=MSFT,200,2
symbol=EMPTY,100,1
max_connections=4096
max_pending=65536
max_pending_per_client=1024
max_buffer_bytes=4194304
heartbeat_ms=500
link_timeout_ms=5000
request_timeout_ms=5000
partial_timeout_ms=2000
reconnect_ms=200
